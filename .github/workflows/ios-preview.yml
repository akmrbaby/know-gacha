name: iOS Preview

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.EAS_IOS_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add EXPO_TOKEN to repository Actions secrets.'
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check iOS configuration
        run: |
          node <<'NODE'
          const { expo } = require('./app.json');
          if (!expo.extra?.eas?.projectId || !expo.ios?.bundleIdentifier) {
            console.error('Complete the initial EAS iOS build setup: projectId and ios.bundleIdentifier are required.');
            process.exit(1);
          }
          NODE
      - name: Build iOS preview
        run: npx eas-cli@27.5.0 build --platform ios --profile preview --non-interactive
