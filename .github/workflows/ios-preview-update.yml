name: iOS Preview Update

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      message:
        description: 更新内容
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-preview-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check update configuration
        run: |
          node <<'NODE'
          const { expo } = require('./app.json');
          const { build } = require('./eas.json');
          const expectedUrl = `https://u.expo.dev/${expo.extra?.eas?.projectId}`;
          if (!expo.extra?.eas?.projectId || expo.updates?.url !== expectedUrl ||
              expo.ios?.runtimeVersion?.policy !== 'appVersion' || !expo.version ||
              build.preview?.channel !== 'preview' || build['map-lab']?.channel === 'preview') {
            console.error('Invalid iOS preview Update configuration. Check URL, runtime version and channels.');
            process.exit(1);
          }
          NODE
      - name: Publish iOS preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ inputs.message || format('develop {0}', github.sha) }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add EXPO_TOKEN to repository Actions secrets.'
            exit 1
          fi
          npx eas-cli@27.5.0 update --platform ios --channel preview --environment preview --message "$UPDATE_MESSAGE" --non-interactive
